version: '3.8'

services:

  # =========================
  # INFRASTRUCTURE
  # =========================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: jobseeker-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"   # management UI only
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jobseeker-mssql
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - backend

  # =========================
  # MICROSERVICES
  # =========================

  identity:
    build:
      context: .
      dockerfile: JobSeeker.Identity/Dockerfile
    container_name: identity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - mssql
      - rabbitmq
    networks:
      - backend

  job:
    build:
      context: .
      dockerfile: JobSeeker.Job/Dockerfile
    container_name: job
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - mssql
      - rabbitmq
    networks:
      - backend

  profile:
    build:
      context: .
      dockerfile: JobSeeker.Profile/Dockerfile
    container_name: profile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - mssql
      - rabbitmq
    networks:
      - backend

  advertisement:
    build:
      context: .
      dockerfile: JobSeeker.Advertisement/Dockerfile
    container_name: advertisement
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - mssql
      - rabbitmq
    networks:
      - backend

  assessment:
    build:
      context: .
      dockerfile: JobSeeker.Assessment/Dockerfile
    container_name: assessment
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - mssql
      - rabbitmq
    networks:
      - backend

  # =========================
  # GATEWAY
  # =========================

  gateway:
    build:
      context: .
      dockerfile: JobSeeker.Gateway/Dockerfile
    container_name: gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - identity
      - job
      - profile
      - advertisement
      - assessment
    ports:
      - "7000:80"   # only exposed service
    networks:
      - backend


volumes:
  rabbitmq-data:
  mssql-data:

networks:
  backend:
    driver: bridge


